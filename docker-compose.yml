services:
  searxng:
    image: searxng/searxng:latest
    container_name: knoledge-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./searxng-settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
      SEARXNG_PORT: "8080"
      SEARXNG_BIND_ADDRESS: 0.0.0.0
      SEARXNG_SECRET: local-only-development-secret-change-before-exposing